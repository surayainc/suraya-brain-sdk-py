# Suraya v1.4 hardening — PyPI publish on tag push.
#
# Triggers on tags matching `v*` (e.g. v0.1.0, v1.2.3).
# Gated on the `production` environment, which has kesuraya
# as a required reviewer (set up at the GitHub UI level).
#
# Secrets required (in the `production` environment):
#   PYPI_TOKEN — PyPI API token with upload rights to the package
#
# Authoring flow:
#   1. Bump version in pyproject.toml
#   2. PR + merge
#   3. git tag vX.Y.Z && git push --tags
#   4. Approve the production deployment in GitHub UI
#   5. Workflow runs twine upload

name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install build tools
        run: python -m pip install --upgrade pip build twine tomli
      - name: Verify tag matches pyproject.toml version
        run: |
          PKG_VERSION=$(python -c "import tomli; print(tomli.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::pyproject.toml version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi
      - name: Build sdist + wheel
        run: python -m build
      - name: Publish
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: twine upload dist/*
