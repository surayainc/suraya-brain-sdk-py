# Suraya v1.4 hardening — Python CI pipeline (pyproject + hatchling).
#
# Runs Lint / Typecheck / Test / Build on every PR and push to main.
# - Lint:      ruff (fails closed only if ruff config exists, else skipped)
# - Typecheck: mypy (best-effort; non-blocking if not configured)
# - Test:      pytest
# - Build:     hatchling build (sdist + wheel)
#
# Mirrors the 4-job naming used by the TS pipeline so branch protection
# can require the same checks org-wide.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        run: python -m pip install --upgrade pip ruff
      - name: Run ruff
        run: ruff check .

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install mypy + project
        run: |
          python -m pip install --upgrade pip mypy
          python -m pip install -e ".[dev]" || python -m pip install -e .
      - name: Run mypy
        run: mypy . --ignore-missing-imports

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install project + dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run pytest
        run: pytest

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install build tools
        run: python -m pip install --upgrade pip build
      - name: Build sdist + wheel
        run: python -m build

  agent-label:
    name: Label agent-generated PRs
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Detect agent-authored PR and label
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = (pr.body || "").toLowerCase();
            const title = (pr.title || "").toLowerCase();
            const looksAgent =
              body.includes("co-authored-by: claude") ||
              body.includes("generated with claude code") ||
              body.includes("generated with cursor") ||
              title.includes("[agent]");
            if (looksAgent) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: ["agent-generated"],
              });
            }
