[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "suraya-brain-sdk"
version = "0.1.0"
description = "Python client for the Suraya brain — typed observation graph retrieval and emission. MIT."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Suraya", email = "kareem@suraya.ai" },
]
keywords = ["suraya", "brain", "observability", "observation-graph", "agents", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]

[project.urls]
Homepage = "https://suraya.ai/schema"
Repository = "https://github.com/surayainc/suraya-brain-sdk-py"
Issues = "https://github.com/surayainc/suraya-brain-sdk-py/issues"

[tool.hatch.build.targets.wheel]
packages = ["suraya_brain_sdk"]
